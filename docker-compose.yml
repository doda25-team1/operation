services:
  model-service:
    image: ${BACKEND_IMAGE}
    container_name: sms-model-service
    environment:
      - PORT=${BACKEND_CONTAINER_PORT}
      - MODEL_VERSION=${MODEL_VERSION}
      - MODEL_BASE_URL=${MODEL_BASE_URL}
    volumes:
      - ../model-service/output:/app/output
    restart: unless-stopped
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${BACKEND_CONTAINER_PORT}/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      
  app-service:
    image: ${FRONTEND_IMAGE}
    container_name: sms-app-service
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - SERVER_PORT=${FRONTEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    depends_on:
      model-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${FRONTEND_CONTAINER_PORT}/sms/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
networks:
  sms-network:
    driver: bridge
