{{- if and .Values.istio.enabled .Values.istio.rateLimit.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ include "doda-sms-app.fullname" . }}-filter-ratelimit
  namespace: {{ .Values.istio.gateway.namespace }}
spec:
  workloadSelector:
    labels:
      {{toYaml .Values.istio.gateway.selector | nindent 6 }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
            domain: ratelimit
            failure_mode_deny: true
            timeout: 10s
            rate_limit_service:
              grpc_service:
                envoy_grpc:
                  cluster_name: outbound|8081||{{ include "doda-sms-app.fullname" . }}-ratelimit.{{ .Values.istio.gateway.namespace }}.svc.cluster.local
                  authority: {{ include "doda-sms-app.fullname" . }}-ratelimit.{{ .Values.istio.gateway.namespace }}.svc.cluster.local
              transport_api_version: V3
              
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
      patch:
        operation: MERGE
        value:
          route:
            rate_limits:
              - actions:
                  - request_headers:
                      header_name: "x-user-id"
                      descriptor_key: "user"
{{- end }}