{{- if and .Values.istio.enabled .Values.istio.rateLimit.enabled }}
# --- CONFIGMAP ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "doda-sms-app.fullname" . }}-ratelimit-config
  namespace: {{ .Values.istio.gateway.namespace }}
  labels:
    {{- include "doda-sms-app.labels" . | nindent 4 }}
data:
  config.yaml: |
    domain: ratelimit
    descriptors:
      - key: user
        value: "*"
        rate_limit:
          unit: minute
          requests_per_unit: 8
---
# --- REDIS SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "doda-sms-app.fullname" . }}-redis
  namespace: {{ .Values.istio.gateway.namespace }} 
  labels:
    app: {{ include "doda-sms-app.fullname" . }}-redis
    {{- include "doda-sms-app.labels" . | nindent 4 }}
spec:
  ports:
  - name: redis
    port: 6379
  selector:
    app: {{ include "doda-sms-app.fullname" . }}-redis
---
# --- REDIS DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doda-sms-app.fullname" . }}-redis
  namespace: {{ .Values.istio.gateway.namespace }} 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "doda-sms-app.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "doda-sms-app.fullname" . }}-redis
    spec:
      containers:
      - image: docker.io/redis:alpine
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - name: redis
          containerPort: 6379
      restartPolicy: Always
---
# --- RATE LIMIT SERVICE ---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "doda-sms-app.fullname" . }}-ratelimit
  namespace: {{ .Values.istio.gateway.namespace }} 
  labels:
    app: {{ include "doda-sms-app.fullname" . }}-ratelimit
    {{- include "doda-sms-app.labels" . | nindent 4 }}
spec:
  ports:
  - name: http-port
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc-port
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: http-debug
    port: 6070
    targetPort: 6070
    protocol: TCP
  selector:
    app: {{ include "doda-sms-app.fullname" . }}-ratelimit
---
# --- RATE LIMIT DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doda-sms-app.fullname" . }}-ratelimit
  namespace: {{ .Values.istio.gateway.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "doda-sms-app.fullname" . }}-ratelimit
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ include "doda-sms-app.fullname" . }}-ratelimit
    spec:
      containers:
      - image: docker.io/envoyproxy/ratelimit:30a4ce1a
        imagePullPolicy: IfNotPresent
        name: ratelimit
        command: ["/bin/ratelimit"]
        env:
        - name: LOG_LEVEL
          value: debug
        - name: REDIS_SOCKET_TYPE
          value: tcp
        - name: REDIS_URL
          value: {{ include "doda-sms-app.fullname" . }}-redis:6379
        - name: USE_STATSD
          value: "false"
        - name: RUNTIME_ROOT
          value: /data
        - name: RUNTIME_SUBDIRECTORY
          value: ratelimit
        - name: RUNTIME_WATCH_ROOT
          value: "false"
        - name: RUNTIME_IGNOREDOTFILES
          value: "true"
        - name: HOST
          value: "::"
        - name: GRPC_HOST
          value: "::"
        ports:
        - containerPort: 8080
        - containerPort: 8081
        - containerPort: 6070
        volumeMounts:
        - name: config-volume
          mountPath: /data/ratelimit/config
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "doda-sms-app.fullname" . }}-ratelimit-config
{{- end }}